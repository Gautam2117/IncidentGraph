name: IncidentGraph AI Evaluation Safety Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-smoke-and-policy-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incidentgraph
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: incidentgraph_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentgraph -d incidentgraph_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://incidentgraph:ci-postgres-password@localhost:5432/incidentgraph_db
      OPENAI_API_KEY: mock-ci-key
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,local]"
      - run: PYTHONPATH=services/control-plane:. alembic -c services/control-plane/alembic.ini upgrade head
      - name: Offline evaluation smoke (never labeled live)
        run: PYTHONPATH=services/control-plane:. python scripts/eval_runner.py --offline --scenarios db_pool_exhaustion,insufficient_evidence --no-export
      - name: Prove degraded rejection and recovered acceptance
        run: PYTHONPATH=services/control-plane:. python scripts/test_ai_regression_gate_cycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: regression-policy-proof
          path: artifacts/regression-proof/
