name: IncidentGraph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incidentgraph
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: incidentgraph_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentgraph -d incidentgraph_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-with-at-least-thirty-two-characters
      WEBHOOK_SIGNING_SECRET: ci-only-webhook-secret
      DATABASE_URL: postgresql+asyncpg://incidentgraph:ci-postgres-password@localhost:5432/incidentgraph_db
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: mock-ci-key
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,local]" bandit pip-audit
      - name: Migrate fresh PostgreSQL database
        run: PYTHONPATH=services/control-plane:. alembic -c services/control-plane/alembic.ini upgrade head
      - name: Ruff
        run: ruff check services/control-plane services/demo scripts
      - name: Mypy
        run: PYTHONPATH=services/control-plane:. mypy services/control-plane/app services/control-plane/tests services/demo/common
      - name: Pytest with measured coverage
        run: PYTHONPATH=services/control-plane:. pytest services/control-plane/tests --cov=app --cov-report=xml --cov-fail-under=77
      - name: Bandit static security scan
        run: bandit -q -r services/control-plane/app services/demo -l -l
      - name: Python dependency audit
        run: pip-audit || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  console-and-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incidentgraph
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: incidentgraph_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentgraph -d incidentgraph_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      CI: "true"
      INCIDENTGRAPH_PYTHON: python
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-with-at-least-thirty-two-characters
      WEBHOOK_SIGNING_SECRET: ci-only-webhook-secret
      DATABASE_URL: postgresql+asyncpg://incidentgraph:ci-postgres-password@localhost:5432/incidentgraph_db
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: mock-ci-key
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      ENABLE_OFFLINE_MODEL_ADAPTER: "true"
      BOOTSTRAP_ADMIN_EMAIL: playwright-admin@incidentgraph.dev
      BOOTSTRAP_ADMIN_PASSWORD: PlaywrightAdminPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: pip install -e ".[dev,local]"
      - run: PYTHONPATH=services/control-plane:. alembic -c services/control-plane/alembic.ini upgrade head
      - run: npm ci
      - run: cd apps/console && npm run build
      - run: cd apps/console && npm run typecheck
      - run: cd apps/console && npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Playwright authenticated workflow
        run: cd apps/console && INCIDENTGRAPH_PYTHON=python npx playwright test

  infrastructure-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Render and lint Helm
        run: |
          helm lint deployments/helm/incidentgraph
          helm template incidentgraph deployments/helm/incidentgraph --namespace incidentgraph > rendered.yaml
      - name: Terraform formatting and validation
        run: |
          terraform -chdir=deployments/terraform fmt -check -recursive
          terraform -chdir=deployments/terraform init -backend=false
          terraform -chdir=deployments/terraform validate

  docker-build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        env:
          SECRET_KEY: compose-validation-secret-key-with-thirty-two-characters
          WEBHOOK_SIGNING_SECRET: compose-webhook-secret
          POSTGRES_PASSWORD: compose-postgres-password
          GRAFANA_ADMIN_PASSWORD: compose-grafana-password
          BOOTSTRAP_ADMIN_EMAIL: admin@incidentgraph.local
          BOOTSTRAP_ADMIN_PASSWORD: compose-bootstrap-password-123
        run: docker compose config --quiet
      - name: Build application images
        run: |
          docker build -f deployments/docker/Dockerfile.control-plane -t incidentgraph/control-plane:ci .
          docker build -f deployments/docker/Dockerfile.console -t incidentgraph/console:ci .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: incidentgraph/control-plane:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
