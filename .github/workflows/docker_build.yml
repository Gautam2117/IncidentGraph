name: Docker Build & Push

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Control Plane Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.control-plane
          push: false
          load: true
          tags: incidentgraph/control-plane:latest

      - name: Build Console UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.console
          push: false
          load: true
          tags: incidentgraph/console:latest
