apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidentgraph.fullname" . }}-console
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.console.type }}
  ports:
    - port: {{ .Values.service.console.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
