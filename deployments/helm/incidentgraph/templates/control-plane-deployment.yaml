apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgraph.fullname" . }}-control-plane
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "incidentgraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "incidentgraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          command: ["alembic", "-c", "services/control-plane/alembic.ini", "upgrade", "head"]
          env:
            {{- include "incidentgraph.controlPlaneEnv" . | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
        - name: bootstrap-admin
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          command: ["python", "scripts/bootstrap_admin.py"]
          env:
            {{- include "incidentgraph.controlPlaneEnv" . | nindent 12 }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrapAdmin.email | quote }}
            - name: BOOTSTRAP_ADMIN_FULL_NAME
              value: {{ .Values.bootstrapAdmin.fullName | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: bootstrap-admin-password }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            {{- include "incidentgraph.controlPlaneEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.controlPlane | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /app/.cache }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgraph.fullname" . }}-worker
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "incidentgraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "incidentgraph.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-control-plane
          image: curlimages/curl:8.15.0
          command:
            - sh
            - -c
            - {{ printf "until curl -fsS http://%s-control-plane:8000/api/v1/health/ready; do sleep 3; done" (include "incidentgraph.fullname" .) | quote }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
          env:
            {{- include "incidentgraph.controlPlaneEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.controlPlane | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /app/.cache }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
