apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "incidentgraph.fullname" . }}-postgres
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "incidentgraph.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "incidentgraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: postgres
          image: {{ .Values.image.postgres | quote }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}] }
            initialDelaySeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}] }
            initialDelaySeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN", "FOWNER", "SETGID", "SETUID"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.storageSize }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidentgraph.fullname" . }}-postgres
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "incidentgraph.fullname" . }}-redis
  labels:
    {{- include "incidentgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "incidentgraph.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "incidentgraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: redis
          image: {{ .Values.image.redis | quote }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] } }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 15 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.storageClassName }}
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.redis.storageSize }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidentgraph.fullname" . }}-redis
spec:
  clusterIP: None
  ports:
    - { name: redis, port: 6379, targetPort: redis }
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
