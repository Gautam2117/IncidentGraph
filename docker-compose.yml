x-control-plane-environment: &control-plane-environment
  APP_ENV: production
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be at least 32 characters}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET must be set}
  DATABASE_URL: postgresql+asyncpg://incidentgraph:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/incidentgraph_db
  REDIS_URL: redis://redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  PROMETHEUS_URL: http://prometheus:9090
  LOKI_URL: http://loki:3100
  TEMPO_URL: http://tempo:3200
  DEMO_GATEWAY_URL: http://gateway:8000
  DEMO_AUTH_URL: http://auth:8000
  DEMO_ORDERS_URL: http://orders:8000
  DEMO_PAYMENTS_URL: http://payments:8000
  DEMO_INVENTORY_URL: http://inventory:8000
  DEMO_NOTIFICATIONS_URL: http://notifications:8000
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PRIMARY_LLM_PROVIDER: ${PRIMARY_LLM_PROVIDER:-openai}
  ENABLE_OFFLINE_MODEL_ADAPTER: ${ENABLE_OFFLINE_MODEL_ADAPTER:-false}
  EMBEDDING_PROVIDER: ${DOCKER_EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${DOCKER_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}

x-demo-environment: &demo-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-demo-service: &demo-service
  restart: unless-stopped
  depends_on:
    otel-collector:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: incidentgraph_db
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentgraph -d incidentgraph_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.control-plane
    environment: *control-plane-environment
    command: ["alembic", "-c", "services/control-plane/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.control-plane
    environment:
      <<: *control-plane-environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be at least 16 characters}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-IncidentGraph Administrator}
    command: ["python", "scripts/bootstrap_admin.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.control-plane
    restart: unless-stopped
    ports:
      - "${CONTROL_PLANE_EXPOSE_PORT:-8000}:8000"
    environment: *control-plane-environment
    volumes:
      - embedding_cache:/app/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.control-plane
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    environment: *control-plane-environment
    volumes:
      - embedding_cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping --timeout=5 > /tmp/celery-ping && test -s /tmp/celery-ping",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  console:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.console
    restart: unless-stopped
    ports:
      - "${CONSOLE_EXPOSE_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://control-plane:8000
    depends_on:
      control-plane:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deployments/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_EXPOSE_PORT:-4317}:4317"
      - "${OTEL_HTTP_EXPOSE_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deployments/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_EXPOSE_PORT:-3200}:3200"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_EXPOSE_PORT:-9090}:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    ports:
      - "${LOKI_EXPOSE_PORT:-3100}:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deployments/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./deployments/promtail/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_EXPOSE_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  gateway:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: gateway
    ports: ["8001:8000"]
    environment:
      <<: *demo-environment
      AUTH_SERVICE_URL: http://auth:8000
      ORDERS_SERVICE_URL: http://orders:8000

  auth:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: auth
    ports: ["8002:8000"]
    environment: *demo-environment

  orders:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: orders
    ports: ["8003:8000"]
    environment:
      <<: *demo-environment
      INVENTORY_SERVICE_URL: http://inventory:8000
      PAYMENTS_SERVICE_URL: http://payments:8000

  payments:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: payments
    ports: ["8004:8000"]
    environment: *demo-environment

  inventory:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: inventory
    ports: ["8005:8000"]
    environment: *demo-environment

  notifications:
    <<: *demo-service
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.demo
      args:
        SERVICE_NAME: notifications
    ports: ["8006:8000"]
    environment: *demo-environment

volumes:
  postgres_data:
  redis_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
  embedding_cache:
